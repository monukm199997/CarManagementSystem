<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trips | Car Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Common CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">

    <!-- Trip CSS -->
    <link rel="stylesheet" href="../assets/css/trips.css">
</head>

<body>

    <div id="appNavbar"></div>

    <!-- ================= SIDEBAR OVERLAY ================= -->

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div id="appSidebar"></div>

    <div id="sidebarOverlay"></div>

    <main class="dashboard-main">

        <!-- Page Header -->
        <div class="page-header">

            <div>
                <h1>Trips</h1>
                <p>Manage vehicle trips and trip history</p>
            </div>

            <div class="trip-header-actions">

                <a href="trip-history.html" class="btn btn-outline-secondary">
                    Trip History
                </a>

                <a href="trip-analytics.html" class="btn btn-outline-primary">
                    Analytics
                </a>

                <button type="button" class="btn-primary" onclick="openTripModal()">
                    + New Trip
                </button>

            </div>

        </div>


        <!-- Summary Cards -->
        <section class="trip-summary-grid">

            <div class="trip-summary-card">
                <div class="summary-label">Total Trips</div>
                <div id="totalTrips" class="summary-value">0</div>
            </div>

            <div class="trip-summary-card">
                <div class="summary-label">Planned</div>
                <div id="plannedTrips" class="summary-value">0</div>
            </div>

            <div class="trip-summary-card">
                <div class="summary-label">Ongoing</div>
                <div id="ongoingTrips" class="summary-value">0</div>
            </div>

            <div class="trip-summary-card">
                <div class="summary-label">Completed</div>
                <div id="completedTrips" class="summary-value">0</div>
            </div>

            <div class="trip-summary-card">
                <div class="summary-label">Cancelled</div>
                <div id="cancelledTrips" class="summary-value">0</div>
            </div>

        </section>


        <!-- Filters -->
        <section class="trip-filter-card">

            <div class="filter-group">

                <label for="tripSearch">
                    Search
                </label>

                <input type="text" id="tripSearch" placeholder="Search location, destination or purpose...">

            </div>


            <div class="filter-group">

                <label for="statusFilter">
                    Status
                </label>

                <select id="statusFilter">

                    <option value="">All Status</option>
                    <option value="planned">Planned</option>
                    <option value="ongoing">Ongoing</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>

                </select>

            </div>


            <div class="filter-actions">

                <button type="button" class="btn-secondary" onclick="resetTripFilters()">
                    Reset
                </button>

            </div>

        </section>


        <!-- Trips Table -->
        <section class="trip-table-card">

            <div class="table-header">

                <div>
                    <h2>Trip List</h2>
                    <span id="tripCountText">
                        0 trips
                    </span>
                </div>

            </div>


            <div class="table-wrapper">

                <table class="trip-table">

                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Driver</th>
                            <th>Car</th>
                            <th>Route</th>
                            <th>Start Date</th>
                            <th>Purpose</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="tripsTableBody">

                        <tr>
                            <td colspan="8" class="loading-cell">
                                Loading trips...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- ========================= -->
    <!-- Trip Modal -->
    <!-- ========================= -->

    <div id="tripModal" class="modal-overlay hidden">

        <div class="trip-modal">

            <div class="modal-header">

                <div>
                    <h2 id="tripModalTitle">
                        Create New Trip
                    </h2>

                    <p>
                        Enter trip information
                    </p>
                </div>

                <button type="button" class="modal-close" onclick="closeTripModal()">
                    ×
                </button>

            </div>


            <form id="tripForm">

                <input type="hidden" id="tripId">


                <!-- Driver + Car -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="driverId">
                            Driver *
                        </label>

                        <select id="driverId" required>
                            <option value="">
                                Select Driver
                            </option>
                        </select>

                    </div>


                    <div class="form-group">

                        <label for="carId">
                            Car *
                        </label>

                        <select id="carId" required>
                            <option value="">
                                Select Car
                            </option>
                        </select>

                    </div>

                </div>


                <!-- Location -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="startLocation">
                            Start Location *
                        </label>

                        <input type="text" id="startLocation" placeholder="e.g. Delhi" required>

                    </div>


                    <div class="form-group">

                        <label for="destination">
                            Destination *
                        </label>

                        <input type="text" id="destination" placeholder="e.g. Jaipur" required>

                    </div>

                </div>


                <!-- Date -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="startDatetime">
                            Start Date & Time *
                        </label>

                        <input type="datetime-local" id="startDatetime" required>

                    </div>


                    <div class="form-group">

                        <label for="endDatetime">
                            End Date & Time
                        </label>

                        <input type="datetime-local" id="endDatetime">

                    </div>

                </div>


                <!-- Odometer -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="startOdometer">
                            Start Odometer
                        </label>

                        <input type="number" id="startOdometer" min="0" step="0.1" placeholder="e.g. 12500">

                    </div>


                    <div class="form-group">

                        <label for="endOdometer">
                            End Odometer
                        </label>

                        <input type="number" id="endOdometer" min="0" step="0.1" placeholder="e.g. 12880">

                    </div>

                </div>


                <!-- Purpose -->
                <div class="form-group">

                    <label for="purpose">
                        Purpose
                    </label>

                    <input type="text" id="purpose" maxlength="255" placeholder="e.g. Client Visit">

                </div>


                <!-- Notes -->
                <div class="form-group">

                    <label for="notes">
                        Notes
                    </label>

                    <textarea id="notes" rows="4" placeholder="Additional trip information..."></textarea>

                </div>


                <!-- Error -->
                <div id="tripFormError" class="form-error hidden"></div>


                <!-- Buttons -->
                <div class="modal-footer">

                    <button type="button" class="btn-secondary" onclick="closeTripModal()">
                        Cancel
                    </button>

                    <button type="submit" class="btn-primary" id="tripSubmitBtn">
                        Create Trip
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Common JS -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/dashboard.js"></script>

    <!-- Trip JS -->
    <script src="../assets/js/trips.js"></script>

</body>

</html>
