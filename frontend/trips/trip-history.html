<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trip History | Car Management System</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Common CSS -->

    <link rel="stylesheet" href="../assets/css/style.css">

    <link rel="stylesheet" href="../assets/css/layout.css">

    <link rel="stylesheet" href="../assets/css/dashboard.css">


    <!-- Trip History CSS -->

    <link rel="stylesheet" href="../assets/css/trip-history.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <div id="appNavbar"></div>


    <!-- ================= SIDEBAR ================= -->

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div id="appSidebar"></div>


    <!-- ================= MAIN ================= -->

    <main class="dashboard-main">


        <!-- ================= HEADER ================= -->

        <div class="trip-history-header">

            <div>

                <h2>
                    Trip History
                </h2>

                <p>
                    View and analyze all vehicle trips.
                </p>

            </div>


            <div class="trip-history-header-actions">

                <a href="trip-analytics.html" class="btn btn-primary">
                    Analytics
                </a>

                <a href="trips.html" class="btn btn-outline-secondary">
                    ← Trips
                </a>

            </div>

        </div>


        <!-- ================= SUMMARY ================= -->

        <section class="trip-history-summary">


            <div class="history-summary-card">

                <div class="history-summary-label">
                    Total Trips
                </div>

                <div id="historyTotalTrips" class="history-summary-value">
                    0
                </div>

            </div>


            <div class="history-summary-card">

                <div class="history-summary-label">
                    Completed
                </div>

                <div id="historyCompletedTrips" class="history-summary-value">
                    0
                </div>

            </div>


            <div class="history-summary-card">

                <div class="history-summary-label">
                    Ongoing
                </div>

                <div id="historyOngoingTrips" class="history-summary-value">
                    0
                </div>

            </div>


            <div class="history-summary-card">

                <div class="history-summary-label">
                    Cancelled
                </div>

                <div id="historyCancelledTrips" class="history-summary-value">
                    0
                </div>

            </div>


            <div class="history-summary-card">

                <div class="history-summary-label">
                    Total Distance
                </div>

                <div id="historyTotalDistance" class="history-summary-value">
                    0 km
                </div>

            </div>


        </section>


        <!-- ================= FILTERS ================= -->

        <section class="trip-history-filter-card">


            <div class="history-filter-row">


                <!-- Search -->

                <div class="history-filter-group">

                    <label for="historySearch">
                        Search
                    </label>

                    <input type="text" id="historySearch" class="form-control"
                        placeholder="Search location, destination or purpose...">

                </div>


                <!-- Driver -->

                <div class="history-filter-group">

                    <label for="historyDriverFilter">
                        Driver
                    </label>

                    <select id="historyDriverFilter" class="form-select">

                        <option value="">
                            All Drivers
                        </option>

                    </select>

                </div>


                <!-- Car -->

                <div class="history-filter-group">

                    <label for="historyCarFilter">
                        Car
                    </label>

                    <select id="historyCarFilter" class="form-select">

                        <option value="">
                            All Cars
                        </option>

                    </select>

                </div>


                <!-- Status -->

                <div class="history-filter-group">

                    <label for="historyStatusFilter">
                        Status
                    </label>

                    <select id="historyStatusFilter" class="form-select">

                        <option value="">
                            All Status
                        </option>

                        <option value="planned">
                            Planned
                        </option>

                        <option value="ongoing">
                            Ongoing
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                        <option value="cancelled">
                            Cancelled
                        </option>

                    </select>

                </div>


            </div>


            <!-- Date Filters -->

            <div class="history-filter-row history-date-row">


                <div class="history-filter-group">

                    <label for="historyFromDate">
                        From Date
                    </label>

                    <input type="date" id="historyFromDate" class="form-control">

                </div>


                <div class="history-filter-group">

                    <label for="historyToDate">
                        To Date
                    </label>

                    <input type="date" id="historyToDate" class="form-control">

                </div>


                <div class="history-filter-buttons">

                    <button type="button" class="btn btn-outline-secondary" onclick="resetHistoryFilters()">
                        Reset
                    </button>

                </div>

            </div>

        </section>


        <!-- ================= TABLE ================= -->

        <section class="trip-history-table-card">


            <div class="trip-history-table-header">

                <div>

                    <h5>
                        Trip Records
                    </h5>

                    <span id="historyCountText">
                        0 trips
                    </span>

                </div>

            </div>


            <!-- Loading -->

            <div id="historyLoading" class="history-loading">

                <div class="spinner-border text-primary" role="status"></div>

                <p>
                    Loading trip history...
                </p>

            </div>


            <!-- Error -->

            <div id="historyError" class="alert alert-danger d-none m-3"></div>


            <!-- Table -->

            <div id="historyTableWrapper" class="table-responsive d-none">

                <table class="table trip-history-table">

                    <thead>

                        <tr>

                            <th>#</th>

                            <th>Driver</th>

                            <th>Car</th>

                            <th>Route</th>

                            <th>Start</th>

                            <th>End</th>

                            <th>Distance</th>

                            <th>Purpose</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="tripHistoryTableBody"></tbody>

                </table>

            </div>


        </section>


    </main>


    <!-- ================= SCRIPTS ================= -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <script src="../assets/js/api.js"></script>

    <script src="../assets/js/auth.js"></script>

    <script src="../assets/js/layout.js"></script>

    <script src="../assets/js/common.js"></script>

    <script src="../assets/js/dashboard.js"></script>


    <script src="../assets/js/trip-history.js"></script>


</body>

</html>
