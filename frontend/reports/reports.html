<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/style.css">

    <link rel="stylesheet" href="../assets/css/layout.css">

    <link rel="stylesheet" href="reports.css">

</head>


<body>

    <!-- Navbar -->
    <div id="appNavbar"></div>


    <!-- Mobile overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>


    <!-- Main sidebar -->
    <div id="appSidebar"></div>


    <!-- Main content -->
    <main class="dashboard-main">

        <div class="reports-page">

            <!-- Page Header -->
            <div class="reports-header">

                <div>

                    <h1>
                        Reports
                    </h1>

                    <p>
                        View, analyze and export your vehicle
                        management reports.
                    </p>

                </div>

            </div>


            <!-- Report Content -->
            <div class="report-content-card">

                <!-- Report Header -->
                <div class="report-content-header">

                    <div>

                        <h2 id="reportTitle">
                            Dashboard Summary
                        </h2>

                        <p id="reportDescription">
                            Overview of your vehicle management data.
                        </p>

                    </div>


                    <!-- Dynamic export buttons -->
                    <div id="reportActions" class="report-actions"></div>

                </div>


                <!-- Dynamic Filters -->
                <div id="reportFilters" class="report-filters"></div>


                <!-- Loading -->
                <div id="reportLoading" class="report-loading" style="display:none;">

                    <div class="spinner-border text-primary"></div>

                    <span>
                        Loading report...
                    </span>

                </div>


                <!-- Error -->
                <div id="reportError" class="alert alert-danger" style="display:none;"></div>


                <!-- Content -->
                <div id="reportContent"></div>

            </div>

        </div>

    </main>


    <script src="../assets/js/api.js"></script>

    <script src="../assets/js/auth.js"></script>

    <script src="../assets/js/layout.js"></script>

    <script src="../assets/js/common.js"></script>

    <script src="reports.js"></script>

</body>

</html>
