<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Car Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body class="auth-page">

    <div class="container">

        <div class="row justify-content-center py-5">

            <div class="col-md-7 col-lg-5">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4">

                        <div class="text-center mb-4">

                            <h2 class="fw-bold">
                                Create Account
                            </h2>

                            <p class="text-muted">
                                Register for Car Management System
                            </p>

                        </div>

                        <div id="registerError" class="alert alert-danger d-none"></div>

                        <div id="registerSuccess" class="alert alert-success d-none"></div>

                        <form id="registerForm">

                            <div class="mb-3">

                                <label for="name" class="form-label">
                                    Full Name
                                </label>

                                <input type="text" id="name" class="form-control" placeholder="Enter your name"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label for="email" class="form-label">
                                    Email
                                </label>

                                <input type="email" id="email" class="form-control" placeholder="Enter your email"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label for="phone" class="form-label">
                                    Phone
                                </label>

                                <input type="tel" id="phone" class="form-control" placeholder="Enter your phone number"
                                    minlength="10" maxlength="15" required>

                            </div>

                            <div class="mb-3">

                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input type="password" id="password" class="form-control"
                                    placeholder="Minimum 8 characters" minlength="8" required>

                            </div>

                            <button type="submit" class="btn btn-primary w-100" id="registerButton">
                                Create Account
                            </button>

                        </form>

                        <div class="text-center mt-3">

                            <span class="text-muted">
                                Already have an account?
                            </span>

                            <a href="login.html">
                                Login
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>

</body>

</html>
