<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications - Car Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/drivers.css">

    <link rel="stylesheet" href="/frontend/assets/css/notifications.css">
</head>

<body>

    <!-- COMMON NAVBAR -->
    <div id="appNavbar"></div>

    <div class="dashboard-layout">

        <!-- COMMON SIDEBAR -->
        <div id="appSidebar"></div>

        <!-- MAIN CONTENT -->
        <main class="dashboard-main">

            <div class="notification-page">

                <!-- HEADER -->
                <div class="notification-page-header">

                    <div>
                        <h1>Notifications</h1>

                        <p>
                            Stay updated with important alerts
                            and system activities.
                        </p>
                    </div>

                    <button type="button" id="markAllReadButton" class="btn btn-primary">
                        Mark all as read
                    </button>

                </div>


                <!-- FILTERS -->
                <div class="notification-filters">

                    <div class="notification-filter-group">

                        <label for="notificationStatusFilter">
                            Status
                        </label>

                        <select id="notificationStatusFilter" class="form-select">
                            <option value="all">
                                All
                            </option>

                            <option value="false">
                                Unread
                            </option>

                            <option value="true">
                                Read
                            </option>
                        </select>

                    </div>


                    <div class="notification-filter-group">

                        <label for="notificationTypeFilter">
                            Type
                        </label>

                        <select id="notificationTypeFilter" class="form-select">
                            <option value="">
                                All Types
                            </option>

                            <option value="document_expiry">
                                Document Expiry
                            </option>

                            <option value="license_expiry">
                                License Expiry
                            </option>

                            <option value="service_due">
                                Service Due
                            </option>

                            <option value="insurance_expiry">
                                Insurance Expiry
                            </option>

                            <option value="tax_expiry">
                                Tax Expiry
                            </option>

                            <option value="trip_alert">
                                Trip Alert
                            </option>

                            <option value="expense_alert">
                                Expense Alert
                            </option>

                            <option value="system">
                                System
                            </option>

                        </select>

                    </div>

                </div>


                <!-- NOTIFICATION LIST -->
                <div id="notificationList" class="notification-list">

                    <div class="notification-loading">
                        Loading notifications...
                    </div>

                </div>

            </div>

        </main>

    </div>


    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/common.js"></script>

    <!-- NOTIFICATIONS -->
    <script src="/frontend/assets/js/notifications.js"></script>

</body>

</html>
