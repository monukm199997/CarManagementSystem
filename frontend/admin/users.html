<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management - Car Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">

     <link rel="stylesheet" href="../assets/css/layout.css">
    <!-- Dashboard CSS -->
    <link rel="stylesheet" href="../assets/css/dashboard.css">

    <!-- Admin CSS -->
    <link rel="stylesheet" href="../assets/css/admin.css">

</head>

<body>

    <div id="appNavbar"></div>

    <!-- ================= SIDEBAR OVERLAY ================= -->

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div id="appSidebar"></div>

    <div id="sidebarOverlay"></div>


    <!-- ==========================================
     MAIN CONTENT
========================================== -->

    <main class="dashboard-main">

        <!-- Page Header -->

        <section class="welcome-section">

            <h2>
                User Management 👥
            </h2>

            <p>
                Manage users and assign system roles.
            </p>

        </section>


        <!-- ======================================
         ALERTS
    ======================================= -->

        <div id="successMessage" class="alert alert-success d-none" role="alert"></div>


        <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>


        <!-- ======================================
         USER TABLE
    ======================================= -->
        <div class="content-card-header">

            <div class="row align-items-center g-3">

                <!-- Title -->

                <div class="col-md-4">

                    <h5 class="mb-0">
                        All Users
                    </h5>

                    <small class="text-muted">
                        Total:
                        <span id="userCount">
                            0
                        </span>
                    </small>

                </div>


                <!-- Search -->

                <div class="col-md-5">

                    <div class="input-group">

                        <span class="input-group-text">
                            🔍
                        </span>

                        <input type="text" id="userSearch" class="form-control"
                            placeholder="Search by name, email or phone...">

                    </div>

                </div>


                <!-- Refresh -->

                <div class="col-md-3 text-md-end">

                    <button id="refreshUsersButton" class="btn btn-sm btn-outline-primary" type="button">
                        🔄 Refresh
                    </button>

                </div>

            </div>

        </div>


        <div class="content-card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                        <tr>

                            <th class="px-4">
                                ID
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Phone
                            </th>

                            <th>
                                Role
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="usersTableBody">

                        <tr>

                            <td colspan="7" class="text-center py-5">
                                Loading users...
                            </td>

                        </tr>

                    </tbody>

                </table>
                <div class="d-flex justify-content-between align-items-center p-3 border-top">

                    <div id="paginationInfo" class="text-muted small">
                        Showing 0 of 0 users
                    </div>


                    <nav>

                        <ul id="pagination" class="pagination pagination-sm mb-0">
                        </ul>

                    </nav>

                </div>

            </div>

        </div>

        </div>

    </main>


    <!-- ==========================================
     JAVASCRIPT
========================================== -->

    <script src="../assets/js/api.js"></script>

    <script src="../assets/js/auth.js"></script>

    <script src="../assets/js/layout.js"></script>

    <script src="../assets/js/common.js"></script>

    <script src="../assets/js/dashboard.js"></script>

    <script src="../assets/js/admin-users.js"></script>

</body>

</html>
